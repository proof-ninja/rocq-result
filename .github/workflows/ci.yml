name: Build and publish documentation

on:
  push:
    branches: ['master']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Rocq ${{ matrix.rocq-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rocq-version: ['9.1', '9.2', '9.3']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build library and coqdoc
        uses: rocq-community/docker-coq-action@v1
        with:
          coq_version: ${{ matrix.rocq-version }}
          custom_script: |
            sudo chown -R "$(id -u):$(id -g)" .
            ./configure.sh
            make -j2
            make html
            test -f html/index.html
      - name: Upload documentation
        if: matrix.rocq-version == '9.3' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: html

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
